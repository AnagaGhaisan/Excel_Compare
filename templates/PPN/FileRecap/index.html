<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileRecap</title>
  <!-- Bootstrap 5 for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="{{ asset_url('images/Logo_4.png') }}">
  <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
</head>

<body id="uploadPage">
  <div class="min-vh-100 d-flex flex-column">
    <nav class="navbar navbar-light bg-light shadow-sm py-2">
      <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="{{ url_for('home') }}">
          <img src="{{ asset_url('images/Logo_3.png') }}" alt="Logo" width="180" />
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="offcanvasNavbarLabel">
              AuditFlow Menu
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>

          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item mb-2">
                <a class="nav-link" href="{{ url_for('home') }}">
                  <i class="bi bi-house-door me-2"></i> Beranda
                </a>
                <hr />
                <h6 class="offcanvas-title fw-bold mb-1" id="offcanvasNavbarLabel">
                  PPN Menu
                </h6>
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link" href="{{ url_for('file_compare') }}">
                  <i class="bi bi-arrow-left-right me-2"></i> Ekualisasi
                </a>
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link" href="{{ url_for('file_recap') }}">
                  <i class="bi bi-calculator me-2"></i> Summary
                </a>
              </li>
              <hr />
              <h6 class="offcanvas-title fw-bold mb-1" id="offcanvasNavbarLabel">
                PPH23 Menu
              </h6>
              <li class="nav-item mb-2">
                <a class="nav-link" href="#">
                  <i class="bi bi-arrow-left-right me-2"></i> #
                </a>
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link" href="#">
                  <i class="bi bi-calculator me-2"></i> #
                </a>
              </li>
              <hr />
              <h6 class="offcanvas-title fw-bold mb-1" id="offcanvasNavbarLabel">
                Lainnya
              </h6>
              <li class="nav-item mb-2">
                <a class="nav-link" href="{{ asset_url('pdf/Standard Operating Procedure .pdf') }}" target="_blank">
                  <i class="bi bi-file-earmark-text me-2"></i> Standard Operation System
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <div class="container justify-content-center my-5 my-md-auto">
      <div class="d-flex flex-column flex-md-row w-100">

        <div class="col-md-6 d-flex justify-content-center align-items-center">
          <img src="{{ asset_url('images/Logo_4.png') }}" alt="Background Image" class="img-fluid">
        </div>

        <div class="col-md-6 ">
          <h1 class="heading text-start w-100">Equalization Recapitulation</h1>
          <p class="text-start mb-3 w-100">Silakan upload File Draft dan File Template PPN Anda.</p>

          <form id="uploadForm" action="/upload_recap" method="POST" enctype="multipart/form-data"
            class="shadow-lg p-4 rounded form-container">

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="k3_file" class="form-label file-label fw-bold mb-0">Upload File Draft (GL):</label>
              </div>
              <input type="file" class="form-control" name="k3_file" id="k3_file" required>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="ppn_file" class="form-label file-label fw-bold mb-0">Upload Rekap PPN:</label>
                <a href="/download-template/ppn-recap" class="btn btn-sm btn-outline-primary"
                  style="font-size: 0.7rem; padding: 2px 8px;">
                  <i class="bi bi-download"></i> Template
                </a>
              </div>
              <input type="file" class="form-control" name="ppn_file" id="ppn_file" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 upload-btn">Process & Recapitulation</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <div id="loadingScreen" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-progress-wrapper">
        <h4 class="fw-bold mb-2">In Process...</h4>
        <p class="text-muted loading-progress-note" id="loadingStatusText">Please wait, system is equalizing your data.</p>
        <div id="loadingProgressContainer" class="progress loading-progress-bar-wrapper mb-2" role="progressbar"
          aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="loadingProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
            style="width: 0%"></div>
        </div>
        <div id="loadingProgressText" class="loading-progress-value">0%</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <script src="{{ asset_url('js/file_recap.js') }}"></script>
</body>

</html>
